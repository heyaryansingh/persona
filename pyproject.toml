[project]
name = "persona"
version = "0.2.0"
description = "A persistent synthetic researcher for the biomedical literature."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.105",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# v2 retrieval/RAG (P4) — installed on demand
retrieval = ["sentence-transformers>=3.0", "faiss-cpu>=1.8", "duckdb>=1.0", "rank-bm25>=0.2"]
# v2 observability (P0/P9)
obs = ["openinference-instrumentation-anthropic", "arize-phoenix", "opentelemetry-sdk"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["persona*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
