<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persona — Provider settings</title>
<style>body{max-width:720px;margin:48px auto;padding:0 18px;font:16px system-ui;color:#242321;background:#f6f6f5}label,input,select,button{display:block;width:100%;box-sizing:border-box;margin:10px 0}input,select,button{padding:10px}button{cursor:pointer}small,#status{color:#666}.card{background:#fff;border:1px solid #ddd;padding:20px;border-radius:10px;margin:18px 0}</style>
<h1>Provider settings</h1><p id="who">Loading…</p><p><a href="/">Back to Persona</a></p>
<div class="card"><h2>Add or rotate a key</h2><p><small>Keys are validated without a generation request, encrypted at rest, and never shown again.</small></p><label>Provider<select id="provider"><option value="anthropic">Anthropic</option><option value="openai">OpenAI</option><option value="huggingface">Hugging Face trial / fallback</option></select></label><label>API key<input id="key" type="password" autocomplete="off" required></label><button id="save">Validate and save</button><p id="status"></p></div><div class="card"><h2>Configured providers</h2><div id="list">Loading…</div></div>
<script>
let csrf=''; const $=id=>document.getElementById(id); const api=(url,opt={})=>fetch(url,{...opt,headers:{...(opt.headers||{}),'X-CSRF-Token':csrf}});
async function load(){let s=await fetch('/api/auth/session');if(!s.ok){location='/auth/login';return} s=await s.json();csrf=s.csrf;$('who').textContent=s.email;let r=await fetch('/api/settings/providers');let d=await r.json();$('list').innerHTML=(d.providers||[]).map(p=>`<p>${p.provider} · configured ${new Date(p.updated_at).toLocaleString()} <button data-p="${p.provider}">Revoke</button></p>`).join('')||'<p>No provider configured.</p>';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{await api('/api/settings/providers/'+encodeURIComponent(b.dataset.p),{method:'DELETE'});load()})}
$('save').onclick=async()=>{const r=await api('/api/settings/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:$('provider').value,key:$('key').value})});$('key').value='';$('status').textContent=r.ok?'Saved.':(await r.json()).detail||'Could not save key.';if(r.ok)load()};load();
</script>
